<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LockerLog{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <!-- Development: Tailwind Play CDN. For final: build static/css/tailwind.css with the Tailwind CLI and link it here instead. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // The single Tailwind config for every page.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Theme colours come from CSS variables (RGB channels, defaults in app.css :root)
            // so a page can retint them, e.g. .theme-christmas on the login page.
            maroon: { 700: "rgb(var(--c-maroon-700) / <alpha-value>)", 800: "rgb(var(--c-maroon-800) / <alpha-value>)", 900: "rgb(var(--c-maroon-900) / <alpha-value>)" },
            brand: { 500: "rgb(var(--c-brand-500) / <alpha-value>)", 600: "rgb(var(--c-brand-600) / <alpha-value>)" },
            gold: { 300: "rgb(var(--c-gold-300) / <alpha-value>)", 500: "rgb(var(--c-gold-500) / <alpha-value>)" },
            offwhite: "rgb(var(--c-offwhite) / <alpha-value>)",
            ink: "rgb(var(--c-ink) / <alpha-value>)",
            mute: "rgb(var(--c-mute) / <alpha-value>)",
            line: "rgb(var(--c-line) / <alpha-value>)",
            white: "#ffffff",
          },
          fontFamily: {
            sans: ['"DM Sans"', "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
            mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login-effects.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %} font-sans text-ink antialiased">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
