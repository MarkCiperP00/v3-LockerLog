<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LockerLog{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <!-- Development: Tailwind Play CDN. For final: build static/css/tailwind.css with the Tailwind CLI and link it here instead. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // The single Tailwind config for every page.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: { 700: "#4a1820", 800: "#3d1118", 900: "#2e0b10" },
            brand: { 500: "#a62a39", 600: "#8b1e2b" },
            gold: { 300: "#e3c766", 500: "#c9a227" },
            offwhite: "#faf9f7",
            ink: "#1a1d29",
            mute: "#5b6070",
            line: "#d9dbe1",
            white: "#ffffff",
          },
          fontFamily: {
            sans: ['"DM Sans"', "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
            mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login-effects.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %} font-sans text-ink antialiased">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
