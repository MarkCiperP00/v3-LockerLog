{% extends "base.html" %}
{% block title %}Log in – LockerLog{% endblock %}
{% block content %}
<form method="post" class="max-w-sm mx-auto mt-16 bg-white p-6 rounded-lg shadow space-y-4">
  <h1 class="text-xl font-bold text-center">Log in to LockerLog</h1>
  <label class="block text-sm">School ID number
    <input name="school_id" required autofocus
           class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </label>
  <label class="block text-sm">Password
    <input type="password" name="password" required
           class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </label>
  <button class="w-full bg-blue-900 text-white py-2 rounded hover:bg-blue-800">Log in</button>
</form>
{% endblock %}
